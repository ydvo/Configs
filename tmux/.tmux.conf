# Tmux Config File

# Terminal / truecolor (requires tmux >= 2.9)
# Advertise a 256-color terminal to programs inside tmux...
set -g default-terminal "tmux-256color"
# ...and tell tmux the OUTER terminal supports 24-bit RGB so it passes it through.
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",xterm*:Tc"

# Responsiveness / integration
set -sg escape-time 10      # near-zero ESC delay (fixes Vim/Neovim Esc lag), safe over SSH
set -g  focus-events on     # forward terminal focus events to apps (nvim autoread/autosave)

# Window/pane indexing: windows start at 0, keep numbering gap-free after closing windows
set -g  base-index 0
setw -g pane-base-index 1
set -g  renumber-windows on

# Colors (matching the previous tmux 1.8 look)
# colour55 -> #5f00af (Amazon Leo purple), colour255 -> #eeeeee (near white)
purple="#5f00af"
white="#eeeeee"

# Visual: status bar off to avoid overlap with the system bar (top) and
# the Neovim statusline (bottom). With only 2-4 windows, switch by number
# (prefix + 1/2/3/4) or peek at the list on demand with prefix + w.
set -g status off
# Toggle the bar back on/off when you want it
bind b set -g status

# status line: purple background, white text
set -g status-style "fg=${white},bg=${purple}"

# Keep the session name on the left, plain
set -g status-left "#S "
set -g status-left-length 100

# Nothing on the right (matches the old config)
set -g status-right ""

# splits open in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Window list: non-current plain "index:name", current bold with no asterisk
set -g window-status-format "#I:#W"
set -g window-status-current-format "#[bold]#I:#W#[nobold]"

# command/message line color
set -g message-style "fg=${white},bg=${purple}"

# copy-mode selection color
set -g mode-style "fg=${white},bg=${purple},bold"

# mouse mode on to enable scrolling
set -g mouse on

# Vi-style copy mode (as in the old config)
setw -g mode-keys vi
bind -T copy-mode-vi v   send-keys -X begin-selection
bind -T copy-mode-vi V   send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# enable clipboard
# Headless Cloud Desktop (NICE DCV): no X11/Wayland. tmux 3.4 emits OSC 52 itself
# when set-clipboard is on, so no external helper (xclip/osc52 script) is needed.
# Requires the local terminal / DCV client to have OSC 52 clipboard access enabled.
set -g set-clipboard on
# Yank in copy-mode-vi: copy the selection (tmux forwards it to the local clipboard
# via OSC 52) and cancel the selection.
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel
# Mirror mouse-drag selections to the clipboard too.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# open lazygit in floating window
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# fzf in floating window
bind-key s display-popup -w 50% -h 25% -E "tmux list-sessions -F '#S' | fzf --reverse --preview 'tmux list-windows -t {}'| xargs -r tmux switch-client -t"


